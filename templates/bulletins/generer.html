{% extends "base.html" %}
{% block titre %}Générer un bulletin{% endblock %}
{% block contenu %}
<h1>Générer un bulletin — {{ employe.prenom }} {{ employe.nom }}</h1>
<form method="post">
    <label>Mois</label>
    <select name="mois" required>
        {% for m in range(1, 13) %}
            <option value="{{ m }}">{{ m }}</option>
        {% endfor %}
    </select>

    <label>Année</label>
    <input type="number" name="annee" value="2026" required>

    <button type="submit" class="btn">Calculer et générer le bulletin</button>
</form>
{% endblock %}
