{% extends "base.html" %}
{% block titre %}Modifier l'élément{% endblock %}
{% block contenu %}

<div class="page-header">
    <div>
        <h1>Modifier l'élément</h1>
        <p class="sous-titre">{{ element.code }} - {{ element.libelle }}</p>
    </div>
</div>

<div class="card">
    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Code *</label>
                <input type="text" name="code" value="{{ element.code }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Libellé *</label>
                <input type="text" name="libelle" value="{{ element.libelle }}" class="form-control" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Type *</label>
                <select name="type_element" class="form-control" required>
                    <option value="prime" {{ 'selected' if element.type_element == 'prime' else '' }}>Prime</option>
                    <option value="indemnite" {{ 'selected' if element.type_element == 'indemnite' else '' }}>Indemnité</option>
                    <option value="retenue" {{ 'selected' if element.type_element == 'retenue' else '' }}>Retenue</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mode de calcul *</label>
                <select name="mode_calcul" class="form-control" required>
                    <option value="montant_fixe" {{ 'selected' if element.mode_calcul == 'montant_fixe' else '' }}>Montant fixe</option>
                    <option value="pourcentage_base" {{ 'selected' if element.mode_calcul == 'pourcentage_base' else '' }}>Pourcentage du salaire de base</option>
                    <option value="bareme_anciennete" {{ 'selected' if element.mode_calcul == 'bareme_anciennete' else '' }}>Barème par ancienneté</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Valeur</label>
                <input type="number" step="0.01" name="valeur" value="{{ element.valeur if element.valeur else '' }}" class="form-control" placeholder="Laisser vide si barème">
            </div>
            <div class="form-group">
                <label>Plafond d'exonération</label>
                <input type="number" step="0.01" name="plafond_exoneration" value="{{ element.plafond_exoneration if element.plafond_exoneration else '' }}" class="form-control" placeholder="Laisser vide si aucun">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>
                    <input type="checkbox" name="soumis_cnss" {{ 'checked' if element.soumis_cnss else '' }}>
                    Soumis à la CNSS
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="soumis_ir" {{ 'checked' if element.soumis_ir else '' }}>
                    Soumis à l'IR
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">Enregistrer</button>
            <a href="{{ url_for('parametrage_societe.vue_ensemble') }}" class="btn btn-danger">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
