{% extends "base.html" %}
{% block titre %}Modifier le barème{% endblock %}
{% block contenu %}

<div class="page-header">
    <div>
        <h1>Modifier le barème</h1>
        <p class="sous-titre">{{ bareme.code }} - {{ bareme.libelle }}</p>
    </div>
</div>

<div class="card">
    <form method="post">
        <div class="form-group">
            <label>Code</label>
            <input type="text" value="{{ bareme.code }}" class="form-control" disabled>
        </div>
        
        <div class="form-group">
            <label>Libellé</label>
            <input type="text" value="{{ bareme.libelle }}" class="form-control" disabled>
        </div>
        
        <div class="form-row">
            <div class="form-group">
                <label>Taux salarié (%) *</label>
                <input type="number" step="0.01" name="taux_salarial" value="{{ bareme.taux_salarial }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Taux patronal (%)</label>
                <input type="number" step="0.01" name="taux_patronal" value="{{ bareme.taux_patronal if bareme.taux_patronal else '' }}" class="form-control" placeholder="Laisser vide si aucun">
            </div>
        </div>
        
        <div class="form-group">
            <label>Plafond mensuel (MAD)</label>
            <input type="number" step="0.01" name="plafond_mensuel" value="{{ bareme.plafond_mensuel if bareme.plafond_mensuel else '' }}" class="form-control" placeholder="Laisser vide si illimité">
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Enregistrer</button>
            <a href="{{ url_for('parametrage_societe.vue_ensemble') }}" class="btn btn-danger">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
