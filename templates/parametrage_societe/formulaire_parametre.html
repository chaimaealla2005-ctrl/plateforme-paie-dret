{% extends "base.html" %}
{% block titre %}Modifier le paramètre{% endblock %}
{% block contenu %}

<div class="page-header">
    <div>
        <h1>Modifier le paramètre</h1>
        <p class="sous-titre">{{ parametre.code }} - {{ parametre.libelle }}</p>
    </div>
</div>

<div class="card">
    <form method="post">
        <div class="form-group">
            <label>Code</label>
            <input type="text" value="{{ parametre.code }}" class="form-control" disabled>
        </div>
        
        <div class="form-group">
            <label>Libellé</label>
            <input type="text" value="{{ parametre.libelle }}" class="form-control" disabled>
        </div>
        
        <div class="form-group">
            <label>Valeur ({{ parametre.unite }}) *</label>
            <input type="number" step="0.01" name="valeur" value="{{ parametre.valeur }}" class="form-control" required>
        </div>
        
        <div class="form-actions">
            <button type="submit" class="btn btn-success">Enregistrer</button>
            <a href="{{ url_for('parametrage_societe.vue_ensemble') }}" class="btn btn-danger">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
