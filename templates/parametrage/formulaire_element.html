{% extends "base.html" %}
{% block titre %}{{ 'Modifier' if element else 'Nouvel' }} élément{% endblock %}
{% block contenu %}

<div class="entete-liste">
    <div>
        <h1>{{ 'Modifier' if element else 'Nouvel élément' }}</h1>
        <p class="sous-titre">{{ 'Modification du catalogue global' if element else 'Ajout au catalogue global' }}</p>
    </div>
</div>

<div class="carte-parametrage">
    <form method="post">
        <div class="form-row">
            <div class="form-group">
                <label>Code *</label>
                <input type="text" name="code" value="{{ element.code if element else '' }}" class="form-control" required>
            </div>
            <div class="form-group">
                <label>Libellé *</label>
                <input type="text" name="libelle" value="{{ element.libelle if element else '' }}" class="form-control" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Type *</label>
                <select name="type_element" class="form-control" required>
                    <option value="prime" {{ 'selected' if element and element.type_element == 'prime' else '' }}>Prime</option>
                    <option value="indemnite" {{ 'selected' if element and element.type_element == 'indemnite' else '' }}>Indemnité</option>
                    <option value="retenue" {{ 'selected' if element and element.type_element == 'retenue' else '' }}>Retenue</option>
                </select>
            </div>
            <div class="form-group">
                <label>Mode de calcul *</label>
                <select name="mode_calcul" class="form-control" required>
                    <option value="montant_fixe" {{ 'selected' if element and element.mode_calcul == 'montant_fixe' else '' }}>Montant fixe</option>
                    <option value="pourcentage_base" {{ 'selected' if element and element.mode_calcul == 'pourcentage_base' else '' }}>Pourcentage du salaire de base</option>
                    <option value="bareme_anciennete" {{ 'selected' if element and element.mode_calcul == 'bareme_anciennete' else '' }}>Barème par ancienneté</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Valeur</label>
                <input type="number" step="0.01" name="valeur" value="{{ element.valeur if element and element.valeur else '' }}" class="form-control" placeholder="Laisser vide si barème">
            </div>
            <div class="form-group">
                <label>Plafond d'exonération</label>
                <input type="number" step="0.01" name="plafond_exoneration" value="{{ element.plafond_exoneration if element and element.plafond_exoneration else '' }}" class="form-control" placeholder="Laisser vide si aucun">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>
                    <input type="checkbox" name="soumis_cnss" {{ 'checked' if element and element.soumis_cnss else '' }}>
                    Soumis à la CNSS
                </label>
            </div>
            <div class="form-group">
                <label>
                    <input type="checkbox" name="soumis_ir" {{ 'checked' if element and element.soumis_ir else '' }}>
                    Soumis à l'IR
                </label>
            </div>
        </div>

        <div class="carte-footer">
            <button type="submit" class="btn btn-modifier">💾 Enregistrer</button>
            <a href="{{ url_for('parametrage.vue_ensemble') }}" class="btn btn-annuler">Annuler</a>
        </div>
    </form>
</div>

{% endblock %}
